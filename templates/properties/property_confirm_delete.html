{% extends 'base.html' %}
{% block title %}O'chirishni tasdiqlang — HomeHub{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-card__title">E'lonni o'chirish</h1>
        <p class="auth-card__subtitle">
            "{{ object.title }}" nomli e'lonni rostdan ham o'chirmoqchimisiz? Bu amalni orqaga qaytarib bo'lmaydi.
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn--primary btn--block">Ha, o'chirish</button>
        </form>
        <a href="{{ object.get_absolute_url }}" class="btn btn--outline btn--block" style="margin-top: 10px;">Bekor qilish</a>
    </div>
</div>
{% endblock %}
